<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Offline · Place Map</title>

    <!--
      A plain file on purpose.

      The service worker serves this for a page that was never visited, so the
      document arrives under some other address - /en/p/noodle-house, say. A
      React page served that way hydrates, asks the server for the data of the
      route in the address bar, cannot reach it, and replaces itself with
      "Something went wrong". Static HTML has nothing to hydrate and simply
      stays put.

      Having an extension also keeps it out of the language redirect, which
      rewrites bare paths to /en.

      Colours are the brand tokens, inline: the stylesheet is hashed per build
      and this file must not depend on which build cached it.
    -->
    <style>
      :root {
        --canvas: #f5f6ff;
        --surface: #ffffff;
        --ink: #0f172a;
        --muted: #64748b;
        --accent: #5d60ee;
        --on-accent: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #0b1220;
          --surface: #1b2538;
          --ink: #e8ecf8;
          --muted: #94a3b8;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 1.5rem;
        text-align: center;
        background: var(--canvas);
        color: var(--ink);
        font-family: Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif;
        line-height: 1.6;
      }
      h1,
      .title {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 700;
      }
      p {
        margin: 0.5rem 0 0;
        color: var(--muted);
        max-width: 24rem;
      }
      a {
        display: inline-block;
        margin-top: 0.5rem;
        padding: 0.65rem 1.25rem;
        border-radius: 9999px;
        background: var(--accent);
        color: var(--on-accent);
        font-weight: 700;
        font-size: 0.875rem;
        text-decoration: none;
      }
      img {
        width: 96px;
        height: 96px;
      }
    </style>
  </head>
  <body>
    <img src="/logo.svg" alt="" width="96" height="96" />

    <div>
      <h1>No connection</h1>
      <p>Pages you have already opened still work. This one has not been opened yet.</p>
    </div>

    <div lang="my">
      <p class="title">အင်တာနက် မရှိပါ</p>
      <p>ဖွင့်ပြီးသော စာမျက်နှာများကို ဆက်ကြည့်နိုင်ပါသည်။ ဤစာမျက်နှာကို မဖွင့်ရသေးပါ။</p>
    </div>

    <a href="/en/saved">Saved places · သိမ်းထားသော နေရာများ</a>
  </body>
</html>
